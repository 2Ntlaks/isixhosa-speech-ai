run: R-0002
stage: 2
what: smoke test of the training pipeline, not a real model
model: openai/whisper-small
language_tag: sw (D-0007)
train: NCHLT xho train split minus 6 dev speakers (seed 42), clips <= 30 s
steps: 20, then resume to 40   # tests checkpoint + resume
