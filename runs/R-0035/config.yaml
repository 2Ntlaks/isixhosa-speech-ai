run: R-0035
stage: 3
what: R-0029's data with the fixed recipe (D-0031 step 3; Neon's pre-flight memo, checked by the lead)
model: openai/whisper-medium @ abdf7c39ab9d0397620ccaea8974cc764cd0953e
language_tag: sw (D-0007)
train: exactly R-0029's (NCHLT train minus 6 dev speakers + FLEURS train <= 30 s + Swivuriso train 1-30 s no [?]
  + 20,563 long-clip pieces; test/dev sentences dropped) = 98,663 clips, 309.68 h expected
steps: 9000; batch 8 x grad-accum 4 = 32 (fallback 4 x 8); lr 1e-5; warmup 500; scheduler linear; bf16; seed 42
