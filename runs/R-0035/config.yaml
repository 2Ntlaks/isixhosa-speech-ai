  swivuriso dev: 22 per speaker x 24 speakers, about half unscripted, references <= 220 tokens, seed 42
selection: combined_cer = 0.5 x swivuriso dev CER + 0.5 x fleurs dev CER (lower is better); save_total_limit 3
runaways: counted per dev set (> 2.5x reference and > 150 letters)
spec_augment: on, with attention mask; mask_time_prob 0.05, mask_time_length 10, mask_time_min_masks 2,
  mask_feature_prob 0.10, mask_feature_length 8, mask_feature_min_masks 1
test: NCHLT test 2770, FLEURS test 1034 (<= 30 s), Swivuriso dev_test 2145, Soapies test 391
  standard decoding: src/eval_guarded.py, CTranslate2 float16 GPU, beam 5, compression ratio 2.4, temperatures
  0.0/0.2/0.4/0.6 best of 5, no log-prob / no-speech checks, no previous text, no timestamps, no VAD
  also: beam 1 + guard; src/baseline.py transformers greedy (NCHLT 96, FLEURS 225, Swivuriso 440 tokens)
outputs: s3 models/R-0035/ and models/R-0035-int8/ (each with COMPLETE); checkpoints s3 jobs/R-0035/checkpoints/
