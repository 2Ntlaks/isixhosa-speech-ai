<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thetha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#100e0b;--ink:#f2e9d8;--soft:#a39883;--faint:#5e564a;--line:#2a241c;--ember:#e2732b;--glow:#ffb067;--ok:#6fd0a6;--err:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% 26%,#2c1d10 0%,transparent 70%),var(--bg);color:var(--ink);
  font:15px/1.5 "JetBrains Mono",ui-monospace,monospace}
.top{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;z-index:2}
.name{font:italic 400 26px/1 "Instrument Serif",Georgia,serif;color:var(--ink);letter-spacing:.01em}
.name b{font-style:normal;color:var(--ember);font-weight:400}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:5px 12px;font:12px "JetBrains Mono",monospace;cursor:pointer}
.pill[aria-pressed="true"]{color:var(--ink);border-color:#e2732b88}
.pill.keep::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--faint);vertical-align:1px}
.pill.keep[aria-pressed="true"]::before{background:var(--ember);box-shadow:0 0 8px var(--ember)}
button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--glow);outline-offset:4px}

main{max-width:760px;margin:0 auto;padding:16vh 16px 80px;display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:300px;height:300px;display:grid;place-items:center}
canvas{position:absolute;inset:0;width:100%;height:100%}
.rec{position:relative;width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 36% 30%,var(--glow),var(--ember) 58%,#a84a15);
  box-shadow:0 20px 60px -18px #e2732bcc,inset 0 -8px 16px #00000030;transition:transform .2s ease}
.rec:hover{transform:scale(1.04)}
.rec::after{content:"";position:absolute;inset:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#1a0e05;transition:border-radius .25s,width .25s,height .25s,margin .25s}
.rec.on::after{border-radius:7px;width:30px;height:30px;margin:-15px}
.rec.busy{filter:saturate(.35) brightness(.75);cursor:progress}
.status{height:22px;margin-top:6px;color:var(--soft);font-size:13px;letter-spacing:.04em;text-align:center}
.status.err{color:var(--err)}

.out{width:100%;margin-top:7vh;display:flex;flex-direction:column;gap:30px}
.say{position:relative;animation:rise .5s ease both}
.say:nth-child(n+2){opacity:.5}.say:nth-child(n+4){opacity:.28}
.say:hover,.say:focus-within{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.txt{margin:0;font:400 clamp(28px,5.6vw,46px)/1.12 "Instrument Serif",Georgia,serif;overflow-wrap:anywhere;outline:none;border-radius:4px;cursor:text}
.txt:empty::before{content:"…";color:var(--faint)}
.txt.edited{color:var(--glow)}
.meta{display:flex;gap:14px;align-items:center;margin-top:8px;color:var(--faint);font-size:12px}
.icon{border:0;background:none;color:var(--soft);cursor:pointer;padding:2px 4px;font:12px "JetBrains Mono",monospace}
.icon:hover{color:var(--ink)}
.save{display:none;color:var(--ember)}
.say.dirty .save{display:inline}
.saved{color:var(--ok)}
@media (max-width:520px){.orb{width:240px;height:240px}.rec{width:100px;height:100px}main{padding-top:13vh}}
@media (prefers-reduced-motion:reduce){.say,.rec{animation:none;transition:none}}
</style>
</head>
<body>
<div class="top">
  <div class="name">Thetha<b>.</b></div>
  <div class="tools"><span id="models" role="group" aria-label="Model"></span><button class="pill keep" id="keep" aria-pressed="true" title="Keep recordings on this laptop (data/my_voice/live)">keep</button></div>
</div>
<main>
  <div class="orb"><canvas id="cv" aria-hidden="true"></canvas><button class="rec" id="rec" aria-label="Start recording (Space)"></button></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="out" id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const NAMES = {"R-0012": "medium", "R-0012-int8": "medium", "R-0007": "small"};
let modelName = null, rec = null, chunks = [], stream = null, ctx = null, an = null, t0 = 0, timer = 0, mode = "idle";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const status = (t, err) => { $("status").textContent = t; $("status").classList.toggle("err", !!err); };

/* keep toggle */
try { if (localStorage.getItem("thetha-keep") === "0") $("keep").setAttribute("aria-pressed", "false"); } catch (e) {}
$("keep").onclick = () => { const on = $("keep").getAttribute("aria-pressed") !== "true"; $("keep").setAttribute("aria-pressed", on);
  try { localStorage.setItem("thetha-keep", on ? "1" : "0"); } catch (e) {} };

/* models: show a switch only when the server offers more than one */
fetch("/models").then(r => r.json()).then(list => {
  if (!list.length) return status("no model loaded", true);
  modelName = list[0];
  if (list.length > 1) $("models").innerHTML = list.map(m => `<button class="pill" data-m="${m}" aria-pressed="${m === modelName}">${NAMES[m] || m}</button>`).join(" ");
  else $("models").innerHTML = `<span class="pill" style="cursor:default">${NAMES[modelName] || modelName}</span>`;
  status("tap to speak");
}).catch(() => status("server not running", true));
$("models").onclick = e => { const b = e.target.closest("button"); if (!b || mode !== "idle") return; modelName = b.dataset.m;
  $("models").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };

/* the ring: breathes when idle, follows the voice when listening, circles while writing */
const cv = $("cv"), g = cv.getContext("2d"), BARS = 84;
let freq = new Uint8Array(128), smooth = new Float32Array(BARS);
function size() { const r = devicePixelRatio || 1, w = cv.clientWidth; cv.width = w * r; cv.height = w * r; g.setTransform(r, 0, 0, r, 0, 0); }
size(); addEventListener("resize", size);
function draw(t) {
  const w = cv.clientWidth, c = w / 2, r0 = w * 0.235;
  g.clearRect(0, 0, w, w);
  if (mode === "listen" && an) an.getByteFrequencyData(freq);
  for (let i = 0; i < BARS; i++) {
    let target;
    if (mode === "listen") target = (freq[2 + (i < BARS / 2 ? i : BARS - i) % 60] / 255) ** 1.4;  // mirrored, so the ring is symmetric
    else if (mode === "busy") { const d = ((i / BARS - t / 1100) % 1 + 1) % 1; target = Math.max(0, 1 - d * 3) * 0.85; }
    else target = 0.06 + 0.04 * Math.sin(t / 900 + i * 0.3);
    smooth[i] += (target - smooth[i]) * (mode === "listen" ? 0.35 : 0.12);
    const a = i / BARS * Math.PI * 2 - Math.PI / 2, len = 6 + smooth[i] * w * 0.2;
    g.strokeStyle = `rgba(255,${150 + smooth[i] * 60 | 0},${80 + smooth[i] * 40 | 0},${0.25 + smooth[i] * 0.75})`;
    g.lineWidth = 2.4; g.lineCap = "round"; g.beginPath();
    g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0); g.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len)); g.stroke();
  }
  if (!still || mode !== "idle") requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const setMode = m => { const was = mode; mode = m; if (still && was === "idle" && m !== "idle") requestAnimationFrame(draw); };

/* recording */
async function start() {
  if (!modelName) return;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: false, noiseSuppression: false}}); }
  catch (e) { return status("allow the microphone, then try again", true); }
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = send; rec.start();
  ctx = new AudioContext(); an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.6;
  ctx.createMediaStreamSource(stream).connect(an);
  t0 = Date.now(); setMode("listen"); $("rec").classList.add("on"); $("rec").setAttribute("aria-label", "Stop recording");
  const tick = () => { const s = (Date.now() - t0) / 1000; status(s.toFixed(1) + " s"); if (s >= 60) stop(); };
  tick(); timer = setInterval(tick, 100);
}
function stop() {
  if (!rec || rec.state !== "recording") return;
  clearInterval(timer); rec.stop(); stream.getTracks().forEach(t => t.stop()); if (ctx) ctx.close(); an = null;
  $("rec").classList.remove("on"); $("rec").setAttribute("aria-label", "Start recording (Space)");
}
async function send() {
  if (Date.now() - t0 < 400) { setMode("idle"); return status("too short", true); }
  const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"});
  setMode("busy"); $("rec").classList.add("busy"); status("writing");
  try {
    const keep = $("keep").getAttribute("aria-pressed") === "true" ? 1 : 0;
    const r = await fetch(`/transcribe?model=${encodeURIComponent(modelName)}&keep=${keep}`, {method: "POST", body: blob});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    show(j, URL.createObjectURL(blob)); status("");
  } catch (e) { status(String(e.message || e).slice(0, 80), true); }
  setMode("idle"); $("rec").classList.remove("busy"); $("rec").focus();
}

/* a transcript: types itself out; click the text to correct it, Enter saves */
function show(j, url) {
  const el = document.createElement("div"); el.className = "say";
  el.innerHTML = `<p class="txt" contenteditable="plaintext-only" spellcheck="false" aria-label="Transcript, edit to correct"></p>
    <div class="meta"><button class="icon play" aria-label="Play recording" title="written in ${j.compute_seconds}s">▶ ${j.audio_seconds}s</button><button class="icon save" aria-label="Save correction">✓ save</button></div>`;
  $("out").prepend(el);
  const p = el.querySelector(".txt"), text = j.text || "";
  let i = 0; const type = () => { p.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(type, still ? 0 : 18); };
  text ? type() : (p.textContent = "");
  const audio = new Audio(url), play = el.querySelector(".play");
  play.onclick = () => audio.paused ? audio.play() : (audio.pause(), audio.currentTime = 0);
  const save = async () => {
    const said = p.textContent.trim();
    const r = await fetch("/correct", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id: j.id, said})});
    el.classList.remove("dirty");
    if (r.ok) { p.classList.add("edited"); const s = document.createElement("span"); s.className = "saved"; s.textContent = "✓ saved"; el.querySelector(".meta").append(s); setTimeout(() => s.remove(), 1800); }
  };
  p.addEventListener("input", () => el.classList.toggle("dirty", p.textContent.trim() !== text));
  p.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (el.classList.contains("dirty")) save(); p.blur(); } });
  el.querySelector(".save").onclick = save;
}

$("rec").onclick = () => { if (mode === "busy") return; (rec && rec.state === "recording") ? stop() : start(); };
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat || e.target.isContentEditable || ["INPUT", "TEXTAREA", "BUTTON"].includes(e.target.tagName)) return;
  e.preventDefault(); $("rec").click();
});
</script>
</body>
</html>
