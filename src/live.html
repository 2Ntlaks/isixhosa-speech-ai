<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thetha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#100e0b;--ink:#f2e9d8;--soft:#a39883;--faint:#5e564a;--line:#2a241c;--ember:#e2732b;--glow:#ffb067;--ok:#6fd0a6;--err:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(900px 520px at 50% 26%,#2c1d10 0%,transparent 70%),var(--bg);color:var(--ink);
  font:15px/1.5 "JetBrains Mono",ui-monospace,monospace}
.top{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;z-index:3;
  background:linear-gradient(var(--bg) 40%,transparent)}
.name{font:italic 400 26px/1 "Instrument Serif",Georgia,serif;letter-spacing:.01em}
.name b{font-style:normal;color:var(--ember);font-weight:400}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.pill{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:5px 11px;font:12px "JetBrains Mono",monospace;cursor:pointer;text-decoration:none;line-height:1.2}
.seg .pill{border:0;padding:4px 10px}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{color:var(--ink);border-color:#e2732b88;background:#e2732b14}
.seg .pill[aria-pressed="true"]{background:#e2732b2a}
.pill.icon{padding:5px 9px}
.pill.keep::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--faint);vertical-align:1px}
.pill.keep[aria-pressed="true"]::before{background:var(--ember);box-shadow:0 0 8px var(--ember)}
button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--glow);outline-offset:4px}

main{max-width:760px;margin:0 auto;padding:15vh 16px 90px;display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:300px;height:300px;display:grid;place-items:center}
canvas{position:absolute;inset:0;width:100%;height:100%}
.rec{position:relative;width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;
  background:radial-gradient(circle at 36% 30%,var(--glow),var(--ember) 58%,#a84a15);
  box-shadow:0 20px 60px -18px #e2732bcc,inset 0 -8px 16px #00000030;transition:transform .2s ease}
.rec:hover{transform:scale(1.04)}
.rec.on{transform:scale(.96)}
.rec::after{content:"";position:absolute;inset:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#1a0e05;transition:all .25s}
.rec.on::after{border-radius:7px;width:30px;height:30px;margin:-15px}
.rec.busy{filter:saturate(.35) brightness(.75);cursor:progress}
.status{height:22px;margin-top:6px;color:var(--soft);font-size:13px;letter-spacing:.04em;text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:var(--err)}

.out{width:100%;margin-top:6vh;display:flex;flex-direction:column;gap:34px}
.say{animation:rise .5s ease both}
.say:nth-child(n+2){opacity:.5}.say:nth-child(n+4){opacity:.28}
.say:hover,.say:focus-within{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.txt{margin:0;font:400 clamp(28px,5.6vw,46px)/1.12 "Instrument Serif",Georgia,serif;overflow-wrap:anywhere;outline:none;border-radius:4px;cursor:text}
.txt:empty::before{content:"…";color:var(--faint)}
.txt.edited{color:var(--glow)}
.alt{margin:6px 0 0;font:italic 400 clamp(19px,3.4vw,26px)/1.2 "Instrument Serif",Georgia,serif;color:var(--soft);overflow-wrap:anywhere}
.alt .who{font:12px "JetBrains Mono",monospace;font-style:normal;color:var(--faint);margin-right:8px;vertical-align:3px}
.alt .d{color:var(--glow);text-decoration:underline wavy #ffb06766;text-underline-offset:4px}
.alt.same{color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:9px;color:var(--faint);font-size:12px}
.act{border:0;background:none;color:var(--soft);cursor:pointer;padding:2px 3px;font:12px "JetBrains Mono",monospace}
.act:hover{color:var(--ink)}
.file{color:var(--faint);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save{display:none;color:var(--ember)}
.say.dirty .save{display:inline}
.flash{color:var(--ok)}

.drop{position:fixed;inset:12px;border:2px dashed var(--ember);border-radius:22px;display:none;place-items:center;z-index:5;
  background:#100e0bd9;font:italic 400 44px "Instrument Serif",Georgia,serif;color:var(--glow)}
body.dragging .drop{display:grid}
@media (max-width:560px){.orb{width:240px;height:240px}.rec{width:100px;height:100px}main{padding-top:17vh}.top{padding:12px}}
@media (prefers-reduced-motion:reduce){.say,.rec{animation:none;transition:none}}
</style>
</head>
<body>
<div class="top">
  <div class="name">Thetha<b>.</b></div>
  <div class="tools">
    <span class="seg" id="models" role="group" aria-label="Model"></span>
    <button class="pill" id="cmp" aria-pressed="false" hidden title="Also run the other model and show both">compare</button>
    <button class="pill icon" id="up" title="Transcribe an audio file (or drop one anywhere)" aria-label="Transcribe an audio file">+</button>
    <a class="pill icon" href="/corrections.tsv" download title="Download all saved corrections" aria-label="Download corrections">↓</a>
    <button class="pill keep" id="keep" aria-pressed="true" title="Keep recordings on this laptop (data/my_voice/live)">keep</button>
  </div>
</div>
<input type="file" id="file" accept="audio/*,video/*,.ogg,.opus,.m4a" hidden>
<main>
  <div class="orb"><canvas id="cv" aria-hidden="true"></canvas><button class="rec" id="rec" aria-label="Record: tap to start and stop, or hold to talk (Space works too)"></button></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="out" id="out"></div>
</main>
<div class="drop" aria-hidden="true">drop to transcribe</div>
<script>
const $ = id => document.getElementById(id);
const NAMES = {"R-0012": "medium", "R-0012-int8": "medium", "R-0007": "small", "R-0007-int8": "small"};
const label = m => NAMES[m] || m;
let models = [], modelName = null, rec = null, chunks = [], stream = null, ctx = null, an = null, t0 = 0, timer = 0, mode = "idle";
let pressedAt = 0, holdable = false;
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const status = (t, err) => { $("status").textContent = t; $("status").classList.toggle("err", !!err); };
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pressed = (el, on) => el.setAttribute("aria-pressed", on);

/* toggles remembered in this browser */
const prefs = (() => { try { return JSON.parse(localStorage.getItem("thetha") || "{}"); } catch (e) { return {}; } })();
const remember = () => { try { localStorage.setItem("thetha", JSON.stringify(prefs)); } catch (e) {} };
if (prefs.keep === false) pressed($("keep"), false);
$("keep").onclick = () => { prefs.keep = $("keep").getAttribute("aria-pressed") !== "true"; pressed($("keep"), prefs.keep); remember(); };
$("cmp").onclick = () => { prefs.cmp = $("cmp").getAttribute("aria-pressed") !== "true"; pressed($("cmp"), prefs.cmp); remember(); };

fetch("/models").then(r => r.json()).then(list => {
  models = list; if (!list.length) return status("no model loaded", true);
  modelName = list.includes(prefs.model) ? prefs.model : list[0];
  $("models").innerHTML = list.map(m => `<button class="pill" data-m="${m}" aria-pressed="${m === modelName}" title="${m}">${label(m)}</button>`).join("");
  if (list.length > 1) { $("cmp").hidden = false; pressed($("cmp"), !!prefs.cmp); }
  status("tap or hold to speak");
}).catch(() => status("server not running", true));
$("models").onclick = e => { const b = e.target.closest("button"); if (!b || mode !== "idle") return;
  modelName = prefs.model = b.dataset.m; remember(); $("models").querySelectorAll("button").forEach(x => pressed(x, x === b)); };
const other = () => models.find(m => m !== modelName);

/* the ring: breathes when idle, follows the voice when listening, circles while writing */
const cv = $("cv"), g = cv.getContext("2d"), BARS = 84;
let freq = new Uint8Array(128), smooth = new Float32Array(BARS);
function size() { const r = devicePixelRatio || 1, w = cv.clientWidth; cv.width = w * r; cv.height = w * r; g.setTransform(r, 0, 0, r, 0, 0); }
size(); addEventListener("resize", size);
function draw(t) {
  const w = cv.clientWidth, c = w / 2, r0 = w * 0.235;
  g.clearRect(0, 0, w, w);
  if (mode === "listen" && an) an.getByteFrequencyData(freq);
  for (let i = 0; i < BARS; i++) {
    let target;
    if (mode === "listen") target = (freq[2 + (i < BARS / 2 ? i : BARS - i) % 60] / 255) ** 1.4;  // mirrored: a symmetric ring
    else if (mode === "busy") { const d = ((i / BARS - t / 1100) % 1 + 1) % 1; target = Math.max(0, 1 - d * 3) * 0.85; }
    else target = 0.06 + 0.04 * Math.sin(t / 900 + i * 0.3);
    smooth[i] += (target - smooth[i]) * (mode === "listen" ? 0.35 : 0.12);
    const a = i / BARS * Math.PI * 2 - Math.PI / 2, len = 6 + smooth[i] * w * 0.2;
    g.strokeStyle = `rgba(255,${150 + smooth[i] * 60 | 0},${80 + smooth[i] * 40 | 0},${0.25 + smooth[i] * 0.75})`;
    g.lineWidth = 2.4; g.lineCap = "round"; g.beginPath();
    g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0); g.lineTo(c + Math.cos(a) * (r0 + len), c + Math.sin(a) * (r0 + len)); g.stroke();
  }
  if (!still || mode !== "idle") requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
const setMode = m => { const was = mode; mode = m; if (still && was === "idle" && m !== "idle") requestAnimationFrame(draw); };

/* recording: a quick tap toggles; holding (button or Space) records until release */
async function start() {
  if (!modelName || mode !== "idle") return;
  setMode("arming");
  const asked = Date.now();
  try { stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: false, noiseSuppression: false}}); }
  catch (e) { setMode("idle"); return status("allow the microphone, then try again", true); }
  holdable = Date.now() - asked < 400;  // after a permission prompt, the press is over: treat it as a tap
  chunks = []; rec = new MediaRecorder(stream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => send(new Blob(chunks, {type: rec.mimeType || "audio/webm"}), Date.now() - t0);
  rec.start();
  ctx = new AudioContext(); an = ctx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.6;
  ctx.createMediaStreamSource(stream).connect(an);
  t0 = Date.now(); setMode("listen"); $("rec").classList.add("on");
  const tick = () => { const s = (Date.now() - t0) / 1000; status(s.toFixed(1) + " s"); if (s >= 120) stop(); };
  tick(); timer = setInterval(tick, 100);
}
function stop() {
  if (!rec || rec.state !== "recording") return;
  clearInterval(timer); rec.stop(); stream.getTracks().forEach(t => t.stop()); if (ctx) ctx.close(); an = null;
  $("rec").classList.remove("on");
}
function press() {
  if (mode === "busy" || mode === "arming") return;
  if (mode === "listen") { stop(); pressedAt = 0; return; }
  pressedAt = Date.now(); start();
}
function release() {
  if (pressedAt && Date.now() - pressedAt > 350 && holdable && mode === "listen") stop();
  pressedAt = 0;
}
$("rec").addEventListener("pointerdown", e => { if (e.button === 0) { e.preventDefault(); press(); } });
addEventListener("pointerup", release); addEventListener("pointercancel", release);
let spaceAt = 0;  // a focused button also "clicks" on Space; that click must not toggle a second time
$("rec").addEventListener("click", e => { if (e.detail === 0 && Date.now() - spaceAt > 150) press(); });  // keyboard Enter
const typing = e => e.target.isContentEditable || ["INPUT", "TEXTAREA"].includes(e.target.tagName);
addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !typing(e)) { e.preventDefault(); press(); } });
addEventListener("keyup", e => { if (e.code === "Space" && !typing(e)) { e.preventDefault(); spaceAt = Date.now(); release(); } });

/* files: the + button, or drop anywhere */
$("up").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; if (f) send(f, Infinity, f.name); $("file").value = ""; };
let depth = 0;
addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { depth++; document.body.classList.add("dragging"); } });
addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); depth = 0; document.body.classList.remove("dragging");
  const f = e.dataTransfer.files[0]; if (f && mode === "idle") send(f, Infinity, f.name); });

async function send(blob, heldMs, fileName) {
  if (heldMs < 400) { setMode("idle"); return status("too short", true); }
  const also = $("cmp").getAttribute("aria-pressed") === "true" && other();
  setMode("busy"); $("rec").classList.add("busy"); status(fileName ? "writing " + fileName : "writing");
  try {
    const keep = $("keep").getAttribute("aria-pressed") === "true" ? 1 : 0;
    const q = `model=${encodeURIComponent(modelName)}&keep=${keep}` + (also ? `&also=${encodeURIComponent(also)}` : "");
    const r = await fetch("/transcribe?" + q, {method: "POST", body: blob});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    show(j, URL.createObjectURL(blob), fileName); status("");
  } catch (e) { status(String(e.message || e).slice(0, 90), true); }
  setMode("idle"); $("rec").classList.remove("busy");
}

/* word-level difference, so the comparison shows only where the models disagree */
function diff(a, b) {
  const x = a.split(/\s+/).filter(Boolean), y = b.split(/\s+/).filter(Boolean);
  const L = Array.from({length: x.length + 1}, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) for (let k = y.length - 1; k >= 0; k--)
    L[i][k] = x[i] === y[k] ? L[i + 1][k + 1] + 1 : Math.max(L[i + 1][k], L[i][k + 1]);
  const keep = new Set(); let i = 0, k = 0;
  while (i < x.length && k < y.length) { if (x[i] === y[k]) { keep.add(k); i++; k++; } else if (L[i + 1][k] >= L[i][k + 1]) i++; else k++; }
  return y.map((w, n) => keep.has(n) ? esc(w) : `<span class="d">${esc(w)}</span>`).join(" ");
}

/* a transcript: types itself out; click the text to correct it, Enter saves */
function show(j, url, fileName) {
  const el = document.createElement("div"); el.className = "say";
  const alt = j.also ? `<p class="alt ${j.also.text === j.text ? "same" : ""}"><span class="who">${esc(label(j.also.model))}</span>${j.also.text === j.text ? "same" : diff(j.text, j.also.text)}</p>` : "";
  const times = `${label(j.model)} ${j.compute_seconds}s` + (j.also ? ` · ${label(j.also.model)} ${j.also.compute_seconds}s` : "");
  el.innerHTML = `<p class="txt" contenteditable="plaintext-only" spellcheck="false" aria-label="Transcript, edit to correct"></p>${alt}
    <div class="meta"><button class="act play" aria-label="Play recording" title="written by ${times}">▶ ${j.audio_seconds}s</button>
    <button class="act copy">copy</button>${fileName ? `<span class="file" title="${esc(fileName)}">${esc(fileName)}</span>` : ""}<button class="act save">✓ save</button></div>`;
  $("out").prepend(el);
  const p = el.querySelector(".txt"), text = j.text || "", meta = el.querySelector(".meta");
  const flash = msg => { const s = document.createElement("span"); s.className = "flash"; s.textContent = msg; meta.append(s); setTimeout(() => s.remove(), 1600); };
  let i = 0; const type = () => { p.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(type, still ? 0 : 18); };
  text ? type() : (p.textContent = "");
  const audio = new Audio(url);
  el.querySelector(".play").onclick = () => audio.paused ? audio.play() : (audio.pause(), audio.currentTime = 0);
  el.querySelector(".copy").onclick = async () => { try { await navigator.clipboard.writeText(p.textContent.trim()); flash("copied"); } catch (e) { flash("select and copy"); } };
  const save = async () => {
    const r = await fetch("/correct", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id: j.id, said: p.textContent.trim()})});
    el.classList.remove("dirty"); if (r.ok) { p.classList.add("edited"); flash("saved"); }
  };
  p.addEventListener("input", () => el.classList.toggle("dirty", p.textContent.trim() !== text));
  p.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (el.classList.contains("dirty")) save(); p.blur(); } });
  el.querySelector(".save").onclick = save;
}
</script>
</body>
</html>
